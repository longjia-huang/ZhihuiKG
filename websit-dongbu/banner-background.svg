<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="40%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="circle-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="circle-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1600" height="900" fill="#0a0a1a"/>
  <rect width="1600" height="900" fill="url(#bg-gradient)" opacity="0.9"/>
  
  <!-- 装饰性几何图形 -->
  <circle cx="150" cy="120" r="100" fill="url(#circle-gradient-1)"/>
  <circle cx="1400" cy="750" r="140" fill="url(#circle-gradient-2)"/>
  <circle cx="1000" cy="150" r="70" fill="url(#circle-gradient-1)" opacity="0.8"/>
  <circle cx="400" cy="780" r="90" fill="url(#circle-gradient-2)" opacity="0.7"/>
  <circle cx="1300" cy="200" r="50" fill="url(#circle-gradient-1)" opacity="0.6"/>
  
  <!-- 网格线 -->
  <g opacity="0.08">
    <line x1="0" y1="450" x2="1600" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="900" stroke="#ffffff" stroke-width="1"/>
    <circle cx="800" cy="450" r="200" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="800" cy="450" r="350" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- 波浪装饰 -->
  <g opacity="0.06">
    <path d="M0 400 Q400 350 800 400 T1600 400" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M0 500 Q400 550 800 500 T1600 500" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- 简单的AI/科技元素 -->
  <g opacity="0.25">
    <!-- 节点1 -->
    <circle cx="200" cy="300" r="8" fill="#667eea" filter="url(#glow)"/>
    <circle cx="240" cy="400" r="6" fill="#764ba2"/>
    <circle cx="180" cy="500" r="7" fill="#f093fb"/>
    <line x1="200" y1="300" x2="240" y2="400" stroke="#667eea" stroke-width="1.5"/>
    <line x1="240" y1="400" x2="180" y2="500" stroke="#764ba2" stroke-width="1.5"/>
    
    <!-- 节点2 -->
    <circle cx="1350" cy="350" r="7" fill="#667eea" filter="url(#glow)"/>
    <circle cx="1420" cy="420" r="8" fill="#764ba2"/>
    <circle cx="1380" cy="520" r="6" fill="#f093fb"/>
    <line x1="1350" y1="350" x2="1420" y2="420" stroke="#667eea" stroke-width="1.5"/>
    <line x1="1420" y1="420" x2="1380" y2="520" stroke="#764ba2" stroke-width="1.5"/>
  </g>
</svg>