var mp3 = document.getElementById("mp3");
var mp3_2 = document.getElementById("mp3_2");

mp3.volume = 0.8;

var playPromise = mp3.play();
if (playPromise !== undefined) {
  playPromise.catch(function(e) { /* autoplay blocked, will play on user interaction */ });
}
var mp3_check=1;
function play_mp3(){
if(mp3_check){
 mp3_check=0;
 mp3.play()
 mp3_2.play();
 mp3_2.pause();
 }
}
window.addEventListener('mousedown',play_mp3);
document.body.addEventListener('mousedown',play_mp3);
document.addEventListener('mousedown',play_mp3);
