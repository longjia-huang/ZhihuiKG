<!DOCTYPE html>
<html lang="zh-CN" class="fullscreen noTransition">
  <head>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"
    />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-orientation" content="landscape" />
    <meta name="browsermode" content="application" />
    <meta name="x5-page-mode" content="app" />
    <meta name="format-detection" content="telephone=no, email=no" />
    <title>实验报告</title>
    <link rel="stylesheet" type="text/css" href="css/reset.css" />
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <link rel="stylesheet" type="text/css" href="css/chart.css" />
    <link rel="stylesheet" type="text/css" href="css/report-info.css" />
    <link rel="stylesheet" type="text/css" href="fonts/font.css">
    <link rel="stylesheet" type="text/css" href="css/animate.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.min.css"> -->
  </head>

  <body>
    <div id="page">
      <!-- 左边图表 -->
      <div class="chart-info-root ">
        <div class="info-container">
          <!-- 标题 -->
          <span class="chart-title-container">
            <img
              src="./images//index/chart-title-icon.png"
              alt=""
              class="chart-title-icon"
              @dragstart.prevent
            />
            学习评价
          </span>
          <!-- 雷达图 -->
          <div class="chart-info-container animated fadeIn">
            <!-- 背景圈 -->
            <div class="circle-container">
              <span class="circle1"> </span>
            </div>
            <!-- 图表 -->
            <div class="chart-container" id="chartContainer"></div>
          </div>
          <!--底部提示-->
        </div>
      </div>
      <!-- 右边报告数据 -->
      <div class="report-info-root animated slideInRight">
        <!-- 标题 -->
        <div class="report-title-container">
          <div class="detail-container">
            <div class="detail-title-container">
              <object
                data="images/index/answer-detail-title.svg"
                type=""
                class="answer-detail-title"
              ></object>
              <!-- 答题详情 -->
              <!-- <span class="detaile-title">
                <img
                  src="./images/index/answer-detail-icon.png"
                  class="detail-icon"
                  alt="答题详情"
                />
                <span class="detail-title">答题详情</span>
              </span> -->
            </div>
            <!-- 得分&等级 -->
            <span class="score-level-container">
              <span class="score-container">
                <span class="score"> 总分: </span>
                <span class="score-value"> 80 </span>
              </span>
            </span>
          </div>
          <!-- 分割线 -->
          <!-- <img src="@/assets//report/title-line.png" class="title-line" alt="" /> -->
          <img src="images/index/title-line.png" class="title-line" alt="" />
        </div>
        <!-- 问题数据 -->
        <div class="question-container" id="question-container"></div>
      </div>
    </div>
    <script src="libs/jquery-1.8.3.min.js"></script>
    <script src="libs/browser.js"></script>
    <script src="libs/moment.js"></script>
    <script src="libs/echarts.js"></script>
    <script src="js/device_tips.js"></script>
    <script src="js/fetchScormQuestion.js"></script>
    <script src="js/questionData.js"></script>
 
    <script src="js/index.js"></script>

    <script src="js/report-info.js"></script>

    <script src="js/init.js"></script>
    <script src="js/chart.js"></script>
  </body>
</html>
