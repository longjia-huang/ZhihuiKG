<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>题库管理 · 智能课程教学平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="../assets/base.css" />
<link rel="stylesheet" href="../assets/product.css" />
<style>
  /* 页面专属样式 */
  .stem-cell { max-width: 560px; }
  .stem-cell .stem { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tbl tbody tr { cursor: pointer; }
  .op-link { color: var(--accent); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .op-link:hover { background: rgba(201,162,75,.12); }
  .op-link.danger { color: var(--red); }
  .op-link.danger:hover { background: rgba(210,106,90,.14); }
  .field .tag-list { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="page-head">
  <div>
    <div class="ph-title">题库管理</div>
    <div class="ph-sub">中国现当代文学 · 课程题库 · 题干、答案、解析、难度与标签的统一维护</div>
  </div>
  <div class="ph-actions">
    <button class="btn btn-outline btn-sm" id="importBtn">导入题目</button>
    <button class="btn btn-primary btn-sm" id="exportBtn">导出题库</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h3>题目列表</h3>
    <span class="hint" id="listCount"></span>
  </div>
  <div class="panel-body" style="padding:16px 20px">
    <div class="toolbar">
      <input class="input" id="searchInput" type="text" placeholder="搜索题干、答案或标签…" style="max-width:280px" />
      <select class="select" id="typeFilter" style="max-width:150px">
        <option value="">全部题型</option>
        <option value="单选">单选题</option>
        <option value="多选">多选题</option>
        <option value="判断">判断题</option>
        <option value="填空">填空题</option>
      </select>
      <select class="select" id="diffFilter" style="max-width:150px">
        <option value="">全部难度</option>
        <option value="简单">简单</option>
        <option value="中等">中等</option>
        <option value="困难">困难</option>
      </select>
      <select class="select" id="kFilter" style="max-width:150px">
        <option value="">全部知识点</option>
        <option value="鲁迅小说">鲁迅小说</option>
        <option value="现代诗歌">现代诗歌</option>
        <option value="现代散文">现代散文</option>
        <option value="京派与海派">京派与海派</option>
        <option value="曹禺戏剧">曹禺戏剧</option>
        <option value="当代文学">当代文学</option>
      </select>
    </div>
  </div>
  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width:46%">题干</th>
          <th>题型</th>
          <th>难度</th>
          <th>知识点</th>
          <th>更新时间</th>
          <th style="width:110px">操作</th>
        </tr>
      </thead>
      <tbody id="qBody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="e-icon"><i class="ri-search-line"></i></div>
    <p>没有匹配的题目，调整筛选条件或导入新的题目。</p>
  </div>
  <div class="pagination">
    <span class="info" id="pageInfo"></span>
    <div class="pages" id="pageBtns"></div>
  </div>
</div>

<!-- 题目详情编辑弹窗 -->
<div class="modal-mask" id="qModal">
  <div class="modal" style="max-width:680px">
    <div class="modal-head">
      <h3 id="modalTitle">题目详情</h3>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label><span class="req">题干</span></label>
        <textarea class="textarea" id="fStem"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label><span class="req">答案</span></label>
          <input class="input" id="fAnswer" type="text" placeholder="例如：A、ABC、正确、精神胜利法" />
        </div>
        <div class="field">
          <label><span class="req">知识点</span></label>
          <select class="select" id="fKnowledge">
            <option>鲁迅小说</option><option>现代诗歌</option><option>现代散文</option>
            <option>京派与海派</option><option>曹禺戏剧</option><option>当代文学</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>解析</label>
        <textarea class="textarea" id="fAnalysis" placeholder="填写答案解析，供学生查看…"></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label>题型</label>
          <select class="select" id="fType">
            <option value="单选">单选题</option>
            <option value="多选">多选题</option>
            <option value="判断">判断题</option>
            <option value="填空">填空题</option>
          </select>
        </div>
        <div class="field">
          <label>难度</label>
          <select class="select" id="fDiff">
            <option value="简单">简单</option>
            <option value="中等">中等</option>
            <option value="困难">困难</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input class="input" id="fTags" type="text" placeholder="例如：基础, 易错" />
      </div>
    </div>
    <div class="modal-foot" style="justify-content:space-between">
      <button class="btn btn-outline btn-sm" id="skipBtn">跳过</button>
      <div style="display:flex;gap:10px">
        <button class="btn btn-outline btn-sm" id="cancelBtn">取消</button>
        <button class="btn btn-outline btn-sm" id="saveNextBtn">保存并添加下一题</button>
        <button class="btn btn-primary btn-sm" id="saveBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var questions = [
    { id: 1, type: '单选', difficulty: '简单', stem: '《狂人日记》是鲁迅哪部小说集的首篇？', answer: 'A', analysis: '《狂人日记》发表于 1918 年，是《呐喊》首篇，也是中国现代文学史上第一篇白话短篇小说。', knowledge: '鲁迅小说', tags: ['基础'], updated: '2026-09-18' },
    { id: 2, type: '单选', difficulty: '中等', stem: '「哀其不幸，怒其不争」是鲁迅对哪个人物态度的概括？', answer: 'A', analysis: '鲁迅对阿Q既同情其不幸又痛恨其麻木不争，以「哀其不幸，怒其不争」概括。', knowledge: '鲁迅小说', tags: ['基础', '易错'], updated: '2026-09-15' },
    { id: 3, type: '单选', difficulty: '简单', stem: '郭沫若以狂飙突进激情开一代诗风的诗集是？', answer: 'A', analysis: '《女神》是郭沫若的代表诗集，以浪漫主义激情体现五四时代精神。', knowledge: '现代诗歌', tags: ['基础'], updated: '2026-09-18' },
    { id: 4, type: '单选', difficulty: '中等', stem: '散文《荷塘月色》的作者是？', answer: 'A', analysis: '《荷塘月色》是朱自清的写景抒情散文名篇。', knowledge: '现代散文', tags: ['基础'], updated: '2026-09-12' },
    { id: 5, type: '单选', difficulty: '中等', stem: '沈从文《边城》的故事发生地是湘西的哪座小城？', answer: 'A', analysis: '《边城》以川湘交界的茶峒为背景，描写渡口少女翠翠的故事。', knowledge: '京派与海派', tags: ['进阶'], updated: '2026-09-10' },
    { id: 6, type: '单选', difficulty: '中等', stem: '《雷雨》中繁漪与周朴园是什么关系？', answer: 'A', analysis: '繁漪是周朴园续娶的妻子，周萍的继母。', knowledge: '曹禺戏剧', tags: ['进阶'], updated: '2026-09-18' },
    { id: 7, type: '单选', difficulty: '简单', stem: '下列不属于朦胧诗代表诗人的是？', answer: 'D', analysis: '舒婷、北岛、顾城是朦胧诗代表诗人；徐志摩属新月派。', knowledge: '当代文学', tags: ['基础'], updated: '2026-09-11' },
    { id: 8, type: '单选', difficulty: '中等', stem: '「人像展览式」结构出自曹禺的哪部作品？', answer: 'A', analysis: '《日出》通过陈白露的客厅展览各色人物，被称为「人像展览式」结构。', knowledge: '曹禺戏剧', tags: ['进阶'], updated: '2026-09-09' },

    { id: 9, type: '多选', difficulty: '中等', stem: '闻一多提出的新诗「三美」包括？', answer: 'ABC', analysis: '闻一多提出新诗应具备音乐美、绘画美、建筑美，代表诗集为《死水》。', knowledge: '现代诗歌', tags: ['基础'], updated: '2026-09-14' },
    { id: 10, type: '多选', difficulty: '简单', stem: '下列属于朱自清散文作品的是？', answer: 'ABC', analysis: '《背影》《荷塘月色》《匆匆》均为朱自清作品；《朝花夕拾》是鲁迅的散文集。', knowledge: '现代散文', tags: ['基础'], updated: '2026-09-13' },
    { id: 11, type: '多选', difficulty: '中等', stem: '下列属于「京派」作家的是？', answer: 'ABC', analysis: '沈从文、朱光潜、周作人属京派；张爱玲是海派作家。', knowledge: '京派与海派', tags: ['进阶'], updated: '2026-09-12' },
    { id: 12, type: '多选', difficulty: '简单', stem: '下列属于曹禺剧作的是？', answer: 'ABC', analysis: '《雷雨》《日出》《原野》均为曹禺作品；《茶馆》是老舍的话剧。', knowledge: '曹禺戏剧', tags: ['基础'], updated: '2026-09-10' },
    { id: 13, type: '多选', difficulty: '中等', stem: '下列属于朦胧诗代表诗人的是？', answer: 'ABC', analysis: '舒婷、北岛、顾城均为朦胧诗代表；闻一多是新月派诗人。', knowledge: '当代文学', tags: ['进阶'], updated: '2026-09-08' },

    { id: 14, type: '判断', difficulty: '简单', stem: '《狂人日记》被誉为中国现代白话小说的开山之作。', answer: '正确', analysis: '《狂人日记》发表于 1918 年，是中国现代文学史上第一篇白话短篇小说。', knowledge: '鲁迅小说', tags: ['基础'], updated: '2026-09-17' },
    { id: 15, type: '判断', difficulty: '简单', stem: '戴望舒的《雨巷》属于新月派诗歌。', answer: '错误', analysis: '《雨巷》是戴望舒现代诗派的代表作，不属于新月派。', knowledge: '现代诗歌', tags: ['基础'], updated: '2026-09-16' },
    { id: 16, type: '判断', difficulty: '中等', stem: '周作人倡导的「美文」概念推动了现代散文的文体自觉。', answer: '正确', analysis: '周作人最早倡导「美文」，推动了现代散文的文体自觉与发展。', knowledge: '现代散文', tags: ['进阶'], updated: '2026-09-11' },
    { id: 17, type: '判断', difficulty: '中等', stem: '张爱玲的《倾城之恋》以香港沦陷为故事背景。', answer: '正确', analysis: '白流苏与范柳原的爱情在日军攻陷香港的背景下发生转折。', knowledge: '京派与海派', tags: ['易错'], updated: '2026-09-09' },
    { id: 18, type: '判断', difficulty: '中等', stem: '《日出》采用了「人像展览式」的结构。', answer: '正确', analysis: '《日出》通过陈白露的客厅展览各色人物，是「人像展览式」结构。', knowledge: '曹禺戏剧', tags: ['进阶'], updated: '2026-09-15' },
    { id: 19, type: '判断', difficulty: '中等', stem: '莫言是首位获得诺贝尔文学奖的中国籍作家。', answer: '正确', analysis: '2012 年莫言获诺贝尔文学奖，是首位获此殊荣的中国籍作家。', knowledge: '当代文学', tags: ['易错'], updated: '2026-09-08' },

    { id: 20, type: '填空', difficulty: '简单', stem: '《阿Q正传》中阿Q最典型的精神特征是 ______。', answer: '精神胜利法', analysis: '精神胜利法是阿Q用自欺与麻木化解现实痛苦的心理机制。', knowledge: '鲁迅小说', tags: ['基础'], updated: '2026-09-14' },
    { id: 21, type: '填空', difficulty: '中等', stem: '闻一多的诗集《死水》体现了新诗的 ______ 主张。', answer: '三美', analysis: '「三美」即音乐美、绘画美、建筑美。', knowledge: '现代诗歌', tags: ['进阶'], updated: '2026-09-12' },
    { id: 22, type: '填空', difficulty: '中等', stem: '《边城》的女主人公是 ______。', answer: '翠翠', analysis: '翠翠是渡船老人的孙女，是《边城》中的女主角。', knowledge: '京派与海派', tags: ['进阶'], updated: '2026-09-10' },
    { id: 23, type: '填空', difficulty: '中等', stem: '曹禺的处女作是 ______。', answer: '《雷雨》', analysis: '《雷雨》是曹禺 1933 年创作的处女作，标志着中国现代话剧的成熟。', knowledge: '曹禺戏剧', tags: ['进阶'], updated: '2026-09-09' },
    { id: 24, type: '填空', difficulty: '简单', stem: '舒婷《致橡树》以 ______ 象征独立平等的爱情观。', answer: '木棉', analysis: '诗中以橡树与木棉并立，象征独立平等的爱情。', knowledge: '当代文学', tags: ['基础'], updated: '2026-09-07' }
  ];

  var nextId = 25;
  var pageSize = 8;
  var currentPage = 1;
  var editingId = null;

  var qBody = document.getElementById('qBody');
  var emptyState = document.getElementById('emptyState');
  var listCount = document.getElementById('listCount');
  var pageInfo = document.getElementById('pageInfo');
  var pageBtns = document.getElementById('pageBtns');
  var searchInput = document.getElementById('searchInput');
  var typeFilter = document.getElementById('typeFilter');
  var diffFilter = document.getElementById('diffFilter');
  var kFilter = document.getElementById('kFilter');
  var modal = document.getElementById('qModal');
  var modalTitle = document.getElementById('modalTitle');

  var fStem = document.getElementById('fStem');
  var fAnswer = document.getElementById('fAnswer');
  var fAnalysis = document.getElementById('fAnalysis');
  var fType = document.getElementById('fType');
  var fDiff = document.getElementById('fDiff');
  var fKnowledge = document.getElementById('fKnowledge');
  var fTags = document.getElementById('fTags');

  function typeCls(t) { return t === '单选' ? 'blue' : t === '多选' ? 'purple' : t === '判断' ? 'green' : 'orange'; }
  function diffCls(d) { return d === '简单' ? 'green' : d === '中等' ? 'orange' : 'red'; }

  function filtered() {
    var kw = searchInput.value.trim().toLowerCase();
    var t = typeFilter.value, d = diffFilter.value, k = kFilter.value;
    return questions.filter(function (q) {
      if (kw && (q.stem + q.answer + q.tags.join(',')).toLowerCase().indexOf(kw) === -1) return false;
      if (t && q.type !== t) return false;
      if (d && q.difficulty !== d) return false;
      if (k && q.knowledge !== k) return false;
      return true;
    });
  }

  function render() {
    var list = filtered();
    var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    var start = (currentPage - 1) * pageSize;
    var pageList = list.slice(start, start + pageSize);

    listCount.textContent = '共 ' + list.length + ' 题';
    emptyState.style.display = list.length ? 'none' : 'block';
    qBody.innerHTML = pageList.map(function (q) {
      return '<tr data-id="' + q.id + '">' +
        '<td class="stem-cell"><div class="cell-main stem">' + escapeHtml(q.stem) + '</div><div class="cell-sub">标签 · ' + escapeHtml(q.tags.join('、')) + '</div></td>' +
        '<td><span class="badge ' + typeCls(q.type) + '">' + q.type + '</span></td>' +
        '<td><span class="badge ' + diffCls(q.difficulty) + '">' + q.difficulty + '</span></td>' +
        '<td><span class="tag blue">' + escapeHtml(q.knowledge) + '</span></td>' +
        '<td>' + q.updated + '</td>' +
        '<td><button class="op-link" data-edit="' + q.id + '">编辑</button><button class="op-link danger" data-del="' + q.id + '">删除</button></td>' +
        '</tr>';
    }).join('');

    pageInfo.textContent = '共 ' + list.length + ' 题 · 第 ' + currentPage + ' / ' + totalPages + ' 页';
    var btns = '';
    btns += '<div class="page-btn" data-pg="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' style="pointer-events:none;opacity:.4"' : '') + '>‹</div>';
    for (var i = 1; i <= totalPages; i++) {
      btns += '<div class="page-btn' + (i === currentPage ? ' active' : '') + '" data-pg="' + i + '">' + i + '</div>';
    }
    btns += '<div class="page-btn" data-pg="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' style="pointer-events:none;opacity:.4"' : '') + '>›</div>';
    pageBtns.innerHTML = btns;
  }

  pageBtns.addEventListener('click', function (e) {
    var b = e.target.closest('.page-btn');
    if (!b) return;
    var p = parseInt(b.getAttribute('data-pg'), 10);
    var totalPages = Math.max(1, Math.ceil(filtered().length / pageSize));
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    render();
  });

  qBody.addEventListener('click', function (e) {
    var edit = e.target.closest('[data-edit]');
    var del = e.target.closest('[data-del]');
    var tr = e.target.closest('tr[data-id]');
    if (edit) { openModal(parseInt(edit.getAttribute('data-edit'), 10)); return; }
    if (del) { removeQuestion(parseInt(del.getAttribute('data-del'), 10)); return; }
    if (tr) { openModal(parseInt(tr.getAttribute('data-id'), 10)); }
  });

  function removeQuestion(id) {
    var q = questions.find(function (x) { return x.id === id; });
    if (!q) return;
    questions = questions.filter(function (x) { return x.id !== id; });
    render();
    toast('已删除题目');
  }

  function openModal(id) {
    var q = questions.find(function (x) { return x.id === id; });
    if (!q) return;
    editingId = id;
    modalTitle.textContent = '题目详情 · #' + q.id;
    fStem.value = q.stem;
    fAnswer.value = q.answer;
    fAnalysis.value = q.analysis;
    fType.value = q.type;
    fDiff.value = q.difficulty;
    fKnowledge.value = q.knowledge;
    fTags.value = q.tags.join(', ');
    modal.classList.add('show');
  }

  function closeModal() { modal.classList.remove('show'); }

  function save() {
    if (editingId == null) return;
    var q = questions.find(function (x) { return x.id === editingId; });
    if (!q) return;
    var stem = fStem.value.trim();
    var answer = fAnswer.value.trim();
    if (!stem) { toast('请填写题干'); return; }
    if (!answer) { toast('请填写答案'); return; }
    q.stem = stem;
    q.answer = answer;
    q.analysis = fAnalysis.value.trim();
    q.type = fType.value;
    q.difficulty = fDiff.value;
    q.knowledge = fKnowledge.value;
    q.tags = fTags.value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    q.updated = '2026-09-21';
    render();
    toast('题目已保存');
  }

  function nextInList() {
    var list = filtered();
    var pos = list.findIndex(function (x) { return x.id === editingId; });
    var next = list[(pos + 1) % list.length];
    return next;
  }

  document.getElementById('saveBtn').addEventListener('click', function () { save(); closeModal(); });
  document.getElementById('saveNextBtn').addEventListener('click', function () {
    save();
    var next = nextInList();
    if (next && next.id !== editingId) openModal(next.id);
    else closeModal();
  });
  document.getElementById('skipBtn').addEventListener('click', function () {
    var next = nextInList();
    if (next && next.id !== editingId) { openModal(next.id); toast('已跳过，切换到下一题'); }
    else closeModal();
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var payload = JSON.stringify(questions, null, 2);
    var blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'question-bank.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('已导出 question-bank.json（共 ' + questions.length + ' 题）');
  });

  document.getElementById('importBtn').addEventListener('click', function () { document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var arr = JSON.parse(reader.result);
        if (!Array.isArray(arr) || !arr.length) throw new Error('empty');
        arr.forEach(function (item) {
          questions.push({
            id: nextId++,
            type: item.type || '单选',
            difficulty: item.difficulty || '简单',
            stem: item.stem || '',
            answer: item.answer || '',
            analysis: item.analysis || '',
            knowledge: item.knowledge || '鲁迅小说',
            tags: item.tags || [],
            updated: '2026-09-21'
          });
        });
        render();
        toast('已导入 ' + arr.length + ' 道题目');
      } catch (err) {
        toast('导入失败：文件格式不正确');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  searchInput.addEventListener('input', function () { currentPage = 1; render(); });
  typeFilter.addEventListener('change', function () { currentPage = 1; render(); });
  diffFilter.addEventListener('change', function () { currentPage = 1; render(); });
  kFilter.addEventListener('change', function () { currentPage = 1; render(); });

  render();
})();
</script>
</body>
</html>
