<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>建设进度 · 智能课程教学平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="../assets/base.css" />
<link rel="stylesheet" href="../assets/product.css" />
<style>
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: stretch; }
  @media (max-width: 960px) { .charts-grid { grid-template-columns: 1fr; } }

  .ring-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .ring-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .ring-card .ring { --r: 54px; }
  .ring-card .ring span { font-size: 16px; }
  .ring-card .r-name { font-weight: 600; font-size: 14px; }
  .ring-card .r-sub { font-size: 12px; color: var(--ink-4); }

  .bars { display: grid; gap: 20px; }
  .bar-row .bar-info { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
  .bar-row .bar-info span:first-child { color: var(--ink-2); font-weight: 500; }
  .bar-row .bar-info .pct { color: var(--accent); font-weight: 700; }
  .bar { height: 12px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter {
    padding: 7px 16px; border-radius: 980px; background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2); transition: .18s;
  }
  .filter:hover { border-color: #b8b8bc; }
  .filter.active { background: var(--accent); color: #241c0d; border-color: transparent; font-weight: 600; }

  .cell-bar { display: flex; align-items: center; gap: 10px; min-width: 170px; }
  .cell-bar .bar { flex: 1; height: 8px; }
  .cell-bar .pct { width: 42px; text-align: right; font-weight: 700; color: var(--ink); font-size: 13px; }
</style>
</head>
<body>

<div class="page-head">
  <div>
    <div class="ph-title">建设进度</div>
    <div class="ph-sub">中国现当代文学 · 知识点建设完成度全景 · 最后更新于 2026-09-21 09:40</div>
  </div>
  <div class="ph-actions">
    <button class="btn btn-outline btn-sm" onclick="exportReport()">导出报告</button>
    <button class="btn btn-primary btn-sm" onclick="refreshProgress()"><i class="ri-refresh-line"></i> 刷新</button>
  </div>
</div>

<div class="kpi-row">
  <div class="kpi">
    <div class="k-icon"><i class="ri-book-2-line"></i></div>
    <div class="k-label">知识点总数</div>
    <div class="k-value" id="kpiTotal">12</div>
    <div class="k-trend">覆盖 7 个章节</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-donut-chart-line"></i></div>
    <div class="k-label">总体完成度</div>
    <div class="k-value" id="kpiOverall">56%</div>
    <div class="k-trend up">较上周提升 6%</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-checkbox-circle-line"></i></div>
    <div class="k-label">已完成</div>
    <div class="k-value" id="kpiDone">2</div>
    <div class="k-trend">100% 达标知识点</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-time-line"></i></div>
    <div class="k-label">进行中</div>
    <div class="k-value" id="kpiDoing">10</div>
    <div class="k-trend">含 2 个未开始</div>
  </div>
</div>

<div class="charts-grid">
  <div class="panel">
    <div class="panel-head"><h3>章节完成度 · 环形</h3><span class="hint">前 4 个核心章节</span></div>
    <div class="panel-body">
      <div class="ring-grid" id="ringGrid"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>章节填充进度 · 条形</h3><span class="hint">覆盖全部课程章节</span></div>
    <div class="panel-body">
      <div class="bars" id="barList"></div>
    </div>
  </div>
</div>

<div class="panel" style="margin-top:20px">
  <div class="panel-head"><h3>知识点建设清单</h3><span class="hint" id="tableCount"></span></div>
  <div class="panel-body">
    <div class="toolbar" style="margin-bottom:16px">
      <div class="filters" id="filters">
        <button class="filter active" data-f="all">全部</button>
        <button class="filter" data-f="done">已完成</button>
        <button class="filter" data-f="doing">进行中</button>
        <button class="filter" data-f="todo">未开始</button>
      </div>
      <span class="spacer"></span>
    </div>
    <div class="table-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th>知识点</th>
            <th>章节</th>
            <th style="width:110px">状态</th>
            <th style="width:230px">完成度</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var kps = [
    { name: '五四文学革命',       chapter: '第 1 章 · 现代文学的发生', pct: 100 },
    { name: '白话文运动',         chapter: '第 1 章 · 现代文学的发生', pct: 84 },
    { name: '鲁迅《呐喊》',       chapter: '第 2 章 · 现代小说', pct: 92 },
    { name: '鲁迅《彷徨》',       chapter: '第 2 章 · 现代小说', pct: 66 },
    { name: '郭沫若《女神》',     chapter: '第 3 章 · 现代诗歌', pct: 78 },
    { name: '新月派与闻一多',     chapter: '第 3 章 · 现代诗歌', pct: 40 },
    { name: '现代散文与朱自清',   chapter: '第 4 章 · 现代散文', pct: 100 },
    { name: '周作人「美文」',     chapter: '第 4 章 · 现代散文', pct: 58 },
    { name: '沈从文《边城》',     chapter: '第 5 章 · 京派与海派', pct: 30 },
    { name: '张爱玲《倾城之恋》', chapter: '第 5 章 · 京派与海派', pct: 22 },
    { name: '曹禺《雷雨》',       chapter: '第 6 章 · 现代戏剧', pct: 0 },
    { name: '朦胧诗与舒婷',       chapter: '第 7 章 · 当代文学', pct: 0 }
  ];

  var chapterNames = ['第 1 章 · 现代文学的发生', '第 2 章 · 现代小说', '第 3 章 · 现代诗歌', '第 4 章 · 现代散文', '第 5 章 · 京派与海派', '第 6 章 · 现代戏剧', '第 7 章 · 当代文学'];
  var chapters = chapterNames.map(function (name) {
    return { name: name, items: kps.filter(function (k) { return k.chapter === name; }) };
  }).filter(function (c) { return c.items.length; });

  var filter = 'all';
  var ringGrid = document.getElementById('ringGrid');
  var barList = document.getElementById('barList');
  var tableBody = document.getElementById('tableBody');

  function statusOf(pct) {
    if (pct >= 100) return 'done';
    if (pct > 0) return 'doing';
    return 'todo';
  }
  function statusText(s) {
    return s === 'done' ? '已完成' : (s === 'doing' ? '进行中' : '未开始');
  }
  function statusBadge(s) {
    if (s === 'done') return '<span class="badge green">已完成</span>';
    if (s === 'doing') return '<span class="badge blue">进行中</span>';
    return '<span class="badge gray">未开始</span>';
  }
  function chapterPct(c) {
    var sum = c.items.reduce(function (s, k) { return s + k.pct; }, 0);
    return Math.round(sum / c.items.length);
  }

  /* ---------- 渲染 ---------- */
  function renderRings() {
    var tops = chapters.slice(0, 4);
    ringGrid.innerHTML = tops.map(function (c) {
      var p = chapterPct(c);
      var st = statusOf(p);
      return '<div class="ring-card">' +
        '<div class="ring" data-p="' + p + '" style="--p:0"><span>0%</span></div>' +
        '<div class="r-name">' + c.name + '</div>' +
        '<div class="r-sub">' + statusText(st) + ' · ' + c.items.length + ' 个知识点</div>' +
      '</div>';
    }).join('');
  }

  function renderBars() {
    barList.innerHTML = chapters.map(function (c) {
      var p = chapterPct(c);
      return '<div class="bar-row">' +
        '<div class="bar-info"><span>' + c.name + '（' + c.items.length + ' 个知识点）</span><span class="pct">' + p + '%</span></div>' +
        '<div class="bar" data-width="' + p + '"><i></i></div>' +
      '</div>';
    }).join('');
  }

  function renderTable() {
    var rows = kps.filter(function (k) {
      if (filter === 'all') return true;
      return statusOf(k.pct) === filter;
    });
    document.getElementById('tableCount').textContent = '共 ' + rows.length + ' 项';
    if (!rows.length) {
      tableBody.innerHTML = '<tr><td colspan="4"><div class="empty"><div class="e-icon"><i class="ri-inbox-line"></i></div><p>当前筛选条件下暂无知识点</p></div></td></tr>';
      return;
    }
    tableBody.innerHTML = rows.map(function (k) {
      var st = statusOf(k.pct);
      return '<tr>' +
        '<td class="cell-main">' + escapeHtml(k.name) + '</td>' +
        '<td>' + escapeHtml(k.chapter) + '</td>' +
        '<td>' + statusBadge(st) + '</td>' +
        '<td><div class="cell-bar"><div class="bar" data-width="' + k.pct + '"><i></i></div><span class="pct">' + k.pct + '%</span></div></td>' +
      '</tr>';
    }).join('');
  }

  function updateKpi(animate) {
    var total = kps.length;
    var overall = Math.round(kps.reduce(function (s, k) { return s + k.pct; }, 0) / total);
    var done = kps.filter(function (k) { return statusOf(k.pct) === 'done'; }).length;
    var doing = kps.filter(function (k) { return statusOf(k.pct) !== 'done'; }).length;
    function set(el, val, suffix) {
      if (animate) countTo(el, val, suffix); else el.textContent = val + suffix;
    }
    set(document.getElementById('kpiTotal'), total, '');
    set(document.getElementById('kpiOverall'), overall, '%');
    set(document.getElementById('kpiDone'), done, '');
    set(document.getElementById('kpiDoing'), doing, '');
  }

  function countTo(el, to, suffix) {
    var from = parseInt(el.textContent, 10) || 0;
    var start = null, dur = 700;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(from + (to - from) * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------- 动画 ---------- */
  function animateRings() {
    ringGrid.querySelectorAll('.ring').forEach(function (r) {
      var p = +r.getAttribute('data-p');
      var span = r.querySelector('span');
      var start = null, dur = 1100;
      function step(ts) {
        if (!start) start = ts;
        var prog = Math.min((ts - start) / dur, 1);
        var eased = 1 - Math.pow(1 - prog, 3);
        var cur = Math.round(p * eased);
        r.style.setProperty('--p', cur);
        if (span) span.textContent = cur + '%';
        if (prog < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  function animateBars() {
    document.querySelectorAll('.bar[data-width]').forEach(function (b) {
      b.querySelector('i').style.width = b.getAttribute('data-width') + '%';
    });
  }
  function animateAll() {
    requestAnimationFrame(function () { animateRings(); animateBars(); });
  }

  function renderAll() {
    renderRings(); renderBars(); renderTable(); animateAll();
  }

  /* ---------- 交互 ---------- */
  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter');
    if (!btn) return;
    filter = btn.getAttribute('data-f');
    this.querySelectorAll('.filter').forEach(function (f) { f.classList.remove('active'); });
    btn.classList.add('active');
    renderTable();
  });

  window.refreshProgress = function () {
    var rng = mulberry32(Date.now() & 0xffffffff);
    kps.forEach(function (k) {
      var st = statusOf(k.pct);
      if (st === 'done') return;
      var delta = st === 'doing' ? 3 + Math.floor(rng() * 9) : (rng() < 0.5 ? 0 : 6 + Math.floor(rng() * 12));
      k.pct = Math.min(100, k.pct + delta);
    });
    renderRings(); renderBars(); renderTable(); animateAll(); updateKpi(true);
    toast('进度已更新');
  };

  window.exportReport = function () {
    var lines = ['中国现当代文学 · 知识点建设进度报告', '导出时间：' + new Date().toLocaleString('zh-CN'), '', '知识点\t章节\t完成度\t状态'];
    kps.forEach(function (k) {
      lines.push(k.name + '\t' + k.chapter + '\t' + k.pct + '%\t' + statusText(statusOf(k.pct)));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '建设进度报告.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('建设进度报告已导出');
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  renderAll();
  updateKpi(false);
})();
</script>
</body>
</html>
