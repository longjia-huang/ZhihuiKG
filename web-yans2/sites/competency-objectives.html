<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>能力目标 · 智能课程教学平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="../assets/base.css" />
<link rel="stylesheet" href="../assets/product.css" />
<style>
  .obj-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .obj-layout { grid-template-columns: 1fr; } }

  .obj-search { margin-bottom: 12px; }
  .obj-list { display: flex; flex-direction: column; gap: 6px; max-height: 620px; overflow-y: auto; }
  .obj-item {
    padding: 12px 14px; border-radius: 12px; cursor: pointer; transition: background .13s;
    border: 1px solid transparent;
  }
  .obj-item:hover { background: var(--bg-soft); }
  .obj-item.active { background: rgba(201,162,75,.10); border-color: rgba(201,162,75,.22); }
  .obj-item .o-top { display: flex; align-items: center; gap: 9px; }
  .obj-item .o-idx {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 7px; background: var(--grad-ai);
    color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700;
  }
  .obj-item .o-name { font-size: 14px; font-weight: 600; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .obj-item .o-meta { display: flex; gap: 10px; font-size: 12px; color: var(--ink-4); margin-top: 6px; padding-left: 33px; }

  .detail-name { font-size: 19px; font-weight: 700; letter-spacing: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail-desc { color: var(--ink-2); font-size: 14px; line-height: 1.7; margin-top: 10px; }
  .rel-block { margin-top: 18px; }
  .rel-block .rel-label { font-size: 12px; font-weight: 600; color: var(--ink-4); margin-bottom: 8px; letter-spacing: .03em; }
  .rel-block .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .sub-table { margin-top: 22px; }
  .sub-table h4 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="page-head">
  <div>
    <div class="ph-title">能力目标</div>
    <div class="ph-sub">中国现当代文学 · 48 学时 · 文学院</div>
  </div>
  <div class="ph-actions">
    <button class="btn btn-primary btn-sm" onclick="openModal()"><i class="ri-add-line"></i> 新建能力目标</button>
  </div>
</div>

<div class="kpi-row">
  <div class="kpi">
    <div class="k-icon"><i class="ri-crosshair-2-line"></i></div>
    <div class="k-label">能力目标数</div>
    <div class="k-value" id="kpiObj">8</div>
    <div class="k-trend">覆盖 6 个专题模块</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-stack-line"></i></div>
    <div class="k-label">子目标数</div>
    <div class="k-value" id="kpiSub">26</div>
    <div class="k-trend">平均每个目标 3.3 项</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-link"></i></div>
    <div class="k-label">已关联知识点</div>
    <div class="k-value" id="kpiKp">43</div>
    <div class="k-trend up">本周新增 6 个</div>
  </div>
  <div class="kpi">
    <div class="k-icon"><i class="ri-question-line"></i></div>
    <div class="k-label">已关联问题</div>
    <div class="k-value" id="kpiQ">18</div>
    <div class="k-trend up">本周新增 3 道</div>
  </div>
</div>

<div class="obj-layout">
  <div class="panel">
    <div class="panel-head"><h3>目标列表</h3><span class="hint" id="listCount"></span></div>
    <div class="panel-body">
      <div class="obj-search">
        <input class="input" id="objSearch" type="text" placeholder="搜索目标名称或描述…" />
      </div>
      <div class="obj-list" id="objList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>目标详情</h3><span class="hint">目标 → 子目标 → 知识点 / 问题</span></div>
    <div class="panel-body" id="detailBody"></div>
  </div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3>新建能力目标</h3>
      <button class="icon-btn" onclick="closeModal()" style="font-size:20px">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="req">目标名称</label>
        <input class="input" id="fName" type="text" placeholder="例如：掌握鲁迅小说的思想主题与艺术成就" />
      </div>
      <div class="field">
        <label>目标描述</label>
        <textarea class="textarea" id="fDesc" placeholder="一句话说明该目标要求学生具备的能力…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="saveObjective()">保存</button>
    </div>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var objectives = [
    {
      id: 'ob-01', name: '掌握中国现代文学的发生与鲁迅小说',
      desc: '理解五四文学革命与现代文学的发生背景，掌握鲁迅小说的思想主题与艺术成就，认识其国民性批判的价值。',
      kp: ['五四文学革命', '《狂人日记》', '《呐喊》', '《彷徨》', '精神胜利法', '国民性批判'],
      q: ['《狂人日记》为何被称为现代白话小说的开山之作？', '如何理解阿 Q 的精神胜利法？'],
      subs: [
        { n: '能梳理五四文学革命的发生背景', d: '文学革命主张与白话文运动', s: 'done' },
        { n: '能概括《呐喊》的思想主题', d: '批判国民性与呼唤觉醒', s: 'done' },
        { n: '能分析阿 Q 形象的典型意义', d: '精神胜利法与国民劣根性', s: 'done' },
        { n: '能对比《呐喊》与《彷徨》的格调', d: '激越与沉郁的差异', s: 'doing' }
      ]
    },
    {
      id: 'ob-02', name: '掌握现代诗歌的发展脉络',
      desc: '掌握郭沫若、新月派、现代派等诗歌流派的风格主张与代表作品，理解现代诗歌形式与审美观念的演变。',
      kp: ['《女神》', '新月派', '闻一多', '现代派', '戴望舒《雨巷》', '自由诗'],
      q: ['《女神》如何体现五四时代精神？', '闻一多提出的「三美」主张是什么？'],
      subs: [
        { n: '能概括《女神》的浪漫主义特征', d: '自我抒情与时代激情', s: 'done' },
        { n: '能理解新月派的格律主张', d: '三美原则与形式追求', s: 'done' },
        { n: '能赏析《雨巷》的意象与韵律', d: '朦胧意境与音乐性', s: 'doing' }
      ]
    },
    {
      id: 'ob-03', name: '掌握现代散文的艺术成就',
      desc: '理解现代散文「美文」观念的确立，掌握周作人、朱自清等作家的散文风格与代表作。',
      kp: ['周作人', '朱自清《背影》', '《荷塘月色》', '美文', '杂文'],
      q: ['朱自清散文的抒情特色是什么？', '如何理解周作人提出的「美文」概念？'],
      subs: [
        { n: '能赏析《背影》的细节描写', d: '白描手法与父子深情', s: 'done' },
        { n: '能分析《荷塘月色》的情景交融', d: '通感与月色意境', s: 'done' },
        { n: '能概述现代散文的文体特征', d: '个性化与自由表达', s: 'todo' }
      ]
    },
    {
      id: 'ob-04', name: '掌握现代长篇小说的代表',
      desc: '掌握茅盾、巴金、老舍等作家的重要长篇小说，理解其现实主义成就与社会剖析价值。',
      kp: ['茅盾《子夜》', '巴金《家》', '老舍《骆驼祥子》', '社会剖析', '现实主义'],
      q: ['《子夜》如何展开社会剖析？', '《家》中觉新形象的悲剧意义是什么？'],
      subs: [
        { n: '能概述《子夜》的结构与主题', d: '民族工业与阶级矛盾', s: 'done' },
        { n: '能分析《家》的反封建主题', d: '觉慧的出走与叛逆', s: 'done' },
        { n: '能分析祥子悲剧的社会根源', d: '个人奋斗与黑暗现实', s: 'doing' }
      ]
    },
    {
      id: 'ob-05', name: '掌握京派与海派小说',
      desc: '掌握沈从文、张爱玲等京派海派作家的风格差异，理解抒情小说与都市传奇的审美追求。',
      kp: ['沈从文', '《边城》', '张爱玲', '《倾城之恋》', '抒情小说', '海派小说'],
      q: ['《边城》为何被称为「田园牧歌」？', '张爱玲小说的都市书写有何特色？'],
      subs: [
        { n: '能赏析《边城》的抒情叙事', d: '散文化结构与湘西世界', s: 'doing' },
        { n: '能理解京派与海派的美学分野', d: '乡土抒情与都市传奇', s: 'doing' },
        { n: '能分析《倾城之恋》的人物', d: '白流苏与范柳原', s: 'todo' }
      ]
    },
    {
      id: 'ob-06', name: '掌握现代戏剧艺术',
      desc: '掌握曹禺戏剧的艺术成就，理解《雷雨》《日出》的戏剧冲突、人物塑造与结构安排。',
      kp: ['曹禺', '《雷雨》', '《日出》', '戏剧冲突', '人物塑造'],
      q: ['《雷雨》的戏剧冲突如何层层推进？', '《日出》的结构方式有何特点？'],
      subs: [
        { n: '能梳理《雷雨》的人物关系', d: '周鲁两家的恩怨纠葛', s: 'done' },
        { n: '能分析繁漪形象的悲剧性', d: '压抑与反抗', s: 'doing' },
        { n: '能理解《日出》的社会批判', d: '群像描写与陈白露', s: 'todo' }
      ]
    },
    {
      id: 'ob-07', name: '掌握当代文学思潮',
      desc: '掌握朦胧诗、寻根文学、先锋小说等当代文学思潮，理解莫言等作家的艺术探索。',
      kp: ['朦胧诗', '舒婷', '寻根文学', '莫言', '魔幻现实主义', '先锋小说'],
      q: ['朦胧诗的「朦胧」体现在哪里？', '莫言小说的魔幻现实主义有何特征？'],
      subs: [
        { n: '能赏析舒婷诗歌的人道主义', d: '《致橡树》的意象', s: 'done' },
        { n: '能概述寻根文学的文化取向', d: '回归传统文化之根', s: 'doing' },
        { n: '能分析莫言小说的叙事艺术', d: '魔幻现实主义与高密东北乡', s: 'todo' }
      ]
    },
    {
      id: 'ob-08', name: '能综合运用文学批评方法',
      desc: '能将文本细读、知人论世、比较阅读等方法迁移到作品分析中，完成从文本到阐释的完整过程。',
      kp: ['文本细读', '知人论世', '比较阅读', '主题分析'],
      q: ['如何用文本细读法分析一篇小说？', '知人论世对理解作品有何帮助？'],
      subs: [
        { n: '能完成一次文本细读', d: '从语言细节到主题提炼', s: 'doing' },
        { n: '能给出多角度作品阐释', d: '主题、人物、手法', s: 'todo' },
        { n: '能输出结构化的赏析报告', d: '包含论点、论据与结论', s: 'todo' }
      ]
    }
  ];

  var currentIdx = 0;
  var listEl = document.getElementById('objList');
  var detailEl = document.getElementById('detailBody');
  var searchInput = document.getElementById('objSearch');

  function statusBadge(s) {
    if (s === 'done') return '<span class="badge green">已达成</span>';
    if (s === 'doing') return '<span class="badge orange">进行中</span>';
    return '<span class="badge gray">未开始</span>';
  }

  function updateKpi() {
    var sub = objectives.reduce(function (s, o) { return s + o.subs.length; }, 0);
    var kp = objectives.reduce(function (s, o) { return s + o.kp.length; }, 0);
    var q = objectives.reduce(function (s, o) { return s + o.q.length; }, 0);
    document.getElementById('kpiObj').textContent = objectives.length;
    document.getElementById('kpiSub').textContent = sub;
    document.getElementById('kpiKp').textContent = kp;
    document.getElementById('kpiQ').textContent = q;
  }

  function renderList() {
    var kw = searchInput.value.trim().toLowerCase();
    var filtered = objectives.map(function (o, i) { return { o: o, i: i }; }).filter(function (x) {
      if (!kw) return true;
      return x.o.name.toLowerCase().indexOf(kw) !== -1 || x.o.desc.toLowerCase().indexOf(kw) !== -1;
    });
    document.getElementById('listCount').textContent = '共 ' + objectives.length + ' 个目标';
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty"><div class="e-icon"><i class="ri-search-line"></i></div><p>未找到匹配的目标</p></div>';
      return;
    }
    listEl.innerHTML = filtered.map(function (x) {
      var o = x.o;
      var done = o.subs.filter(function (s) { return s.s === 'done'; }).length;
      return '<div class="obj-item' + (x.i === currentIdx ? ' active' : '') + '" data-i="' + x.i + '">' +
        '<div class="o-top"><span class="o-idx">' + String(x.i + 1).padStart(2, '0') + '</span>' +
        '<span class="o-name">' + escapeHtml(o.name) + '</span></div>' +
        '<div class="o-meta"><span>子目标 ' + o.subs.length + '</span><span>已达成 ' + done + '</span><span>知识点 ' + o.kp.length + '</span></div>' +
      '</div>';
    }).join('');
  }

  function renderDetail() {
    var o = objectives[currentIdx];
    if (!o) { detailEl.innerHTML = ''; return; }
    var subRows = o.subs.map(function (s) {
      return '<tr><td class="cell-main">' + escapeHtml(s.n) + '</td>' +
        '<td class="cell-sub" style="font-size:13px;color:var(--ink-3)">' + escapeHtml(s.d) + '</td>' +
        '<td>' + statusBadge(s.s) + '</td></tr>';
    }).join('');
    detailEl.innerHTML =
      '<div class="detail-name">' + escapeHtml(o.name) +
        '<span class="badge blue">' + o.subs.length + ' 个子目标</span>' +
      '</div>' +
      '<div class="detail-desc">' + escapeHtml(o.desc) + '</div>' +
      '<div class="rel-block"><div class="rel-label">关联知识点 · ' + o.kp.length + ' 个</div>' +
        '<div class="tags">' + o.kp.map(function (t) { return '<span class="tag blue">' + escapeHtml(t) + '</span>'; }).join('') + '</div></div>' +
      '<div class="rel-block"><div class="rel-label">关联问题 · ' + o.q.length + ' 道</div>' +
        '<div class="tags">' + o.q.map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div></div>' +
      '<div class="sub-table"><h4>子目标明细</h4>' +
        '<div class="table-wrap"><table class="tbl"><thead><tr><th style="width:36%">子目标名称</th><th>描述</th><th style="width:110px">状态</th></tr></thead>' +
        '<tbody>' + subRows + '</tbody></table></div></div>';
  }

  listEl.addEventListener('click', function (e) {
    var it = e.target.closest('.obj-item');
    if (!it) return;
    currentIdx = +it.getAttribute('data-i');
    renderList(); renderDetail();
  });

  searchInput.addEventListener('input', renderList);

  /* 新建目标弹窗 */
  window.openModal = function () {
    document.getElementById('modal').classList.add('show');
    document.getElementById('fName').value = '';
    document.getElementById('fDesc').value = '';
    setTimeout(function () { document.getElementById('fName').focus(); }, 60);
  };
  window.closeModal = function () {
    document.getElementById('modal').classList.remove('show');
  };
  window.saveObjective = function () {
    var name = document.getElementById('fName').value.trim();
    var desc = document.getElementById('fDesc').value.trim();
    if (!name) { toast('请填写目标名称'); document.getElementById('fName').focus(); return; }
    objectives.push({
      id: 'ob-' + Date.now(), name: name, desc: desc || '目标描述待补充',
      kp: [], q: [],
      subs: [{ n: '待拆解子目标', d: '创建后可在课程建设中逐步补充', s: 'todo' }]
    });
    currentIdx = objectives.length - 1;
    closeModal();
    updateKpi(); renderList(); renderDetail();
    toast('能力目标已保存');
  };

  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) closeModal();
  });

  renderList(); renderDetail();
})();
</script>
</body>
</html>
