<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 出题 · 智能课程教学平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<link rel="stylesheet" href="../assets/base.css" />
<link rel="stylesheet" href="../assets/product.css" />
<style>
  /* 页面专属样式 */
  .gen-layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .gen-layout { grid-template-columns: 1fr; } }

  .q-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px; padding: 20px 22px; animation: qrise .4s var(--ease); }
  @keyframes qrise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .q-card + .q-card { margin-top: 16px; }
  .q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .q-stem { font-size: 15.5px; font-weight: 600; line-height: 1.6; margin-bottom: 14px; }
  .q-options { display: grid; gap: 9px; }
  .q-opt { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: 11px; border: 1px solid var(--line-soft); background: var(--bg-soft-2); font-size: 14px; }
  .q-opt .letter { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 6px; background: var(--bg-soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .q-opt.right { border-color: rgba(134,173,122,.5); background: rgba(134,173,122,.12); }
  .q-opt.right .letter { background: var(--green); color: #1c2218; }
  .q-opt .flag { margin-left: auto; color: var(--green); font-size: 12px; white-space: nowrap; }
  .q-analysis { margin-top: 13px; font-size: 13px; color: var(--ink-3); background: var(--bg-soft-2); border-radius: 10px; padding: 11px 13px; line-height: 1.6; }
  .q-analysis b { color: var(--ink-2); }
  .q-actions { display: flex; gap: 10px; margin-top: 14px; }
  .q-actions .btn { padding: 8px 15px; font-size: 13px; border-radius: 10px; }
  .gen-empty { text-align: center; padding: 60px 20px; color: var(--ink-4); }
  .gen-empty .e-icon { font-size: 44px; margin-bottom: 12px; opacity: .6; }
  .gen-meta { font-size: 13px; color: var(--ink-4); display: flex; align-items: center; gap: 8px; }
  .gen-meta b { color: var(--accent); font-size: 16px; }
</style>
</head>
<body>

<div class="page-head">
  <div>
    <div class="ph-title">AI 出题</div>
    <div class="ph-sub">中国现当代文学 · 按作家作品或参考文本智能组题 · 答案与解析同步生成</div>
  </div>
</div>

<div class="gen-layout">
  <!-- 配置面板 -->
  <div class="panel" style="align-self:start">
    <div class="panel-head">
      <h3>出题配置</h3>
      <span class="hint" id="configSummary"></span>
    </div>
    <div class="panel-body">
      <div class="field">
        <label>题型</label>
        <div class="opt-group" id="typeRow">
          <label class="opt active"><input type="radio" name="qtype" value="single" checked />单选题</label>
          <label class="opt"><input type="radio" name="qtype" value="multi" />多选题</label>
          <label class="opt"><input type="radio" name="qtype" value="judge" />判断题</label>
          <label class="opt"><input type="radio" name="qtype" value="blank" />填空题</label>
          <label class="opt"><input type="radio" name="qtype" value="mixed" />混合题型</label>
        </div>
      </div>

      <div class="field">
        <label>出题模式</label>
        <div class="opt-group" id="modeRow">
          <label class="opt active"><input type="radio" name="qmode" value="knowledge" checked />按知识点</label>
          <label class="opt"><input type="radio" name="qmode" value="context" />按参考内容</label>
        </div>
      </div>

      <div class="field" id="knowledgeGroup">
        <label>选择知识点（最多 3 个）</label>
        <div class="opt-group" id="knowledgeRow">
          <label class="opt active"><input type="checkbox" name="qk" value="鲁迅小说" checked />鲁迅小说</label>
          <label class="opt"><input type="checkbox" name="qk" value="现代诗歌" />现代诗歌</label>
          <label class="opt"><input type="checkbox" name="qk" value="现代散文" />现代散文</label>
          <label class="opt"><input type="checkbox" name="qk" value="京派与海派" />京派与海派</label>
          <label class="opt"><input type="checkbox" name="qk" value="曹禺戏剧" />曹禺戏剧</label>
          <label class="opt"><input type="checkbox" name="qk" value="当代文学" />当代文学</label>
        </div>
        <div class="help" id="kHelp">当前已选 1 个知识点</div>
      </div>

      <div class="field" id="contextGroup" style="display:none">
        <label>参考内容</label>
        <textarea class="textarea" id="ctxInput" placeholder="粘贴文学文本、讲义或赏析原文，AI 将据此提炼考点并出题…">沈从文的《边城》以湘西茶峒为背景，讲述了船家少女翠翠与天保、傩送兄弟之间的爱情悲剧。小说以清新淡远的抒情笔调，营造了一个充满「人性美」与「人情美」的湘西世界，被誉为现代文学史上「田园牧歌」式的代表作。</textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label>题目数量</label>
          <select class="select" id="countSelect">
            <option value="3">3 题</option>
            <option value="5" selected>5 题</option>
            <option value="10">10 题</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn btn-primary btn-block" id="genBtn">生成题目</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 结果区 -->
  <div>
    <div class="panel">
      <div class="panel-head">
        <h3>生成结果</h3>
        <span class="gen-meta">本次 <b id="resultCount">0</b> 题 · 已加入题库 <b id="bankCount">0</b> 题</span>
      </div>
      <div class="panel-body" id="results"></div>
    </div>
  </div>
</div>

<script src="../assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var POOL = [
    { k: '鲁迅小说', type: 'single', difficulty: '简单', stem: '鲁迅小说集《呐喊》收录的第一篇作品是？', options: ['《狂人日记》', '《阿Q正传》', '《药》', '《孔乙己》'], answer: 0, analysis: '《狂人日记》是《呐喊》首篇，也是中国现代文学史上第一篇白话短篇小说。' },
    { k: '鲁迅小说', type: 'single', difficulty: '中等', stem: '「哀其不幸，怒其不争」是鲁迅对哪个人物态度的概括？', options: ['阿Q', '祥林嫂', '孔乙己', '闰土'], answer: 0, analysis: '鲁迅对阿Q既同情其不幸又痛恨其麻木不争，以「哀其不幸，怒其不争」概括。' },
    { k: '鲁迅小说', type: 'judge', difficulty: '简单', stem: '《狂人日记》以白话写成，被誉为中国现代白话小说的开山之作。', options: ['正确', '错误'], answer: 0, analysis: '《狂人日记》发表于 1918 年，是中国现代文学史上第一篇白话短篇小说。' },
    { k: '鲁迅小说', type: 'blank', difficulty: '简单', stem: '《阿Q正传》中阿Q最典型的精神特征是 ______。', options: [], answer: '精神胜利法', analysis: '精神胜利法是阿Q用自欺与麻木化解现实痛苦的心理机制。' },

    { k: '现代诗歌', type: 'single', difficulty: '简单', stem: '郭沫若的哪部诗集以狂飙突进的激情开一代诗风？', options: ['《女神》', '《死水》', '《雨巷》', '《再别康桥》'], answer: 0, analysis: '《女神》是郭沫若的代表诗集，以浪漫主义激情体现五四时代精神。' },
    { k: '现代诗歌', type: 'multi', difficulty: '中等', stem: '闻一多提出的新诗「三美」包括？', options: ['音乐美', '绘画美', '建筑美', '朦胧美'], answer: [0, 1, 2], analysis: '闻一多提出新诗应具备音乐美、绘画美、建筑美，代表诗集为《死水》。' },
    { k: '现代诗歌', type: 'judge', difficulty: '简单', stem: '戴望舒的《雨巷》属于新月派诗歌。', options: ['正确', '错误'], answer: 1, analysis: '《雨巷》是戴望舒现代派诗歌的代表作，属于现代诗派而非新月派。' },
    { k: '现代诗歌', type: 'blank', difficulty: '中等', stem: '闻一多的诗集《死水》体现了新诗的 ______ 主张。', options: [], answer: '三美', analysis: '「三美」即音乐美、绘画美、建筑美。' },

    { k: '现代散文', type: 'single', difficulty: '中等', stem: '散文《荷塘月色》的作者是？', options: ['朱自清', '周作人', '鲁迅', '冰心'], answer: 0, analysis: '《荷塘月色》是朱自清的写景抒情散文名篇。' },
    { k: '现代散文', type: 'multi', difficulty: '简单', stem: '下列属于朱自清散文作品的是？', options: ['《背影》', '《荷塘月色》', '《匆匆》', '《朝花夕拾》'], answer: [0, 1, 2], analysis: '《背影》《荷塘月色》《匆匆》均为朱自清作品；《朝花夕拾》是鲁迅的散文集。' },
    { k: '现代散文', type: 'judge', difficulty: '简单', stem: '周作人倡导的「美文」概念推动了现代散文的文体自觉。', options: ['正确', '错误'], answer: 0, analysis: '周作人最早倡导「美文」，推动了现代散文的文体自觉与发展。' },
    { k: '现代散文', type: 'blank', difficulty: '中等', stem: '朱自清《背影》通过父亲 ______ 这一细节表现深沉的父爱。', options: [], answer: '攀爬月台', analysis: '父亲攀爬月台为「我」买橘子的背影，是全文的核心细节。' },

    { k: '京派与海派', type: 'single', difficulty: '中等', stem: '沈从文《边城》的故事发生地是湘西的哪座小城？', options: ['茶峒', '凤凰', '张家界', '常德'], answer: 0, analysis: '《边城》以川湘交界的茶峒为背景，描写渡口少女翠翠的故事。' },
    { k: '京派与海派', type: 'multi', difficulty: '中等', stem: '下列属于「京派」作家的是？', options: ['沈从文', '朱光潜', '周作人', '张爱玲'], answer: [0, 1, 2], analysis: '沈从文、朱光潜、周作人属京派；张爱玲是海派作家。' },
    { k: '京派与海派', type: 'judge', difficulty: '中等', stem: '张爱玲的《倾城之恋》以香港沦陷为故事背景。', options: ['正确', '错误'], answer: 0, analysis: '《倾城之恋》中白流苏与范柳原的爱情在日军攻陷香港的背景下发生转折。' },
    { k: '京派与海派', type: 'blank', difficulty: '中等', stem: '《边城》的女主人公是 ______。', options: [], answer: '翠翠', analysis: '翠翠是渡船老人的孙女，是《边城》中的女主角。' },

    { k: '曹禺戏剧', type: 'single', difficulty: '中等', stem: '《雷雨》中繁漪与周朴园是什么关系？', options: ['妻子', '女儿', '妹妹', '情人'], answer: 0, analysis: '繁漪是周朴园续娶的妻子，周萍的继母。' },
    { k: '曹禺戏剧', type: 'multi', difficulty: '简单', stem: '下列属于曹禺剧作的是？', options: ['《雷雨》', '《日出》', '《原野》', '《茶馆》'], answer: [0, 1, 2], analysis: '《雷雨》《日出》《原野》均为曹禺作品；《茶馆》是老舍的话剧。' },
    { k: '曹禺戏剧', type: 'judge', difficulty: '中等', stem: '《日出》采用了「人像展览式」的结构。', options: ['正确', '错误'], answer: 0, analysis: '《日出》通过陈白露的客厅展览各色人物，结构上被称为「人像展览式」。' },
    { k: '曹禺戏剧', type: 'blank', difficulty: '中等', stem: '曹禺的处女作是 ______。', options: [], answer: '《雷雨》', analysis: '《雷雨》是曹禺 1933 年创作的处女作，标志着中国现代话剧的成熟。' },

    { k: '当代文学', type: 'single', difficulty: '简单', stem: '下列不属于朦胧诗代表诗人的是？', options: ['舒婷', '北岛', '顾城', '徐志摩'], answer: 3, analysis: '舒婷、北岛、顾城是朦胧诗代表诗人；徐志摩属新月派。' },
    { k: '当代文学', type: 'multi', difficulty: '中等', stem: '下列属于朦胧诗代表诗人的是？', options: ['舒婷', '北岛', '顾城', '闻一多'], answer: [0, 1, 2], analysis: '舒婷、北岛、顾城均为朦胧诗代表；闻一多是新月派诗人。' },
    { k: '当代文学', type: 'judge', difficulty: '中等', stem: '莫言是首位获得诺贝尔文学奖的中国籍作家。', options: ['正确', '错误'], answer: 0, analysis: '2012 年莫言获诺贝尔文学奖，是首位获此殊荣的中国籍作家。' },
    { k: '当代文学', type: 'blank', difficulty: '简单', stem: '舒婷《致橡树》以 ______ 象征独立平等的爱情观。', options: [], answer: '木棉', analysis: '诗中以橡树与木棉并立，象征独立平等的爱情。' }
  ];

  var typeName = { single: '单选题', multi: '多选题', judge: '判断题', blank: '填空题' };
  var typeBadge = { single: 'blue', multi: 'purple', judge: 'green', blank: 'orange' };
  var diffBadge = { '简单': 'green', '中等': 'orange', '困难': 'red' };

  var bankCount = 0;
  var results = document.getElementById('results');
  var resultCount = document.getElementById('resultCount');
  var bankCountEl = document.getElementById('bankCount');
  var configSummary = document.getElementById('configSummary');

  function selectedType() {
    var el = document.querySelector('input[name="qtype"]:checked');
    return el ? el.value : 'single';
  }
  function selectedMode() {
    var el = document.querySelector('input[name="qmode"]:checked');
    return el ? el.value : 'knowledge';
  }
  function selectedK() {
    return Array.prototype.slice.call(document.querySelectorAll('input[name="qk"]:checked')).map(function (i) { return i.value; });
  }

  function syncOptGroup() {
    document.querySelectorAll('#typeRow .opt, #modeRow .opt, #knowledgeRow .opt').forEach(function (label) {
      var input = label.querySelector('input');
      label.classList.toggle('active', input.checked);
    });
    var k = selectedK();
    document.getElementById('kHelp').textContent = '当前已选 ' + k.length + ' 个知识点';
    configSummary.textContent = typeName[selectedType()] + (selectedMode() === 'knowledge' ? ' · ' + k.length + ' 个知识点' : ' · 参考内容');
  }

  document.getElementById('typeRow').addEventListener('change', syncOptGroup);
  document.getElementById('modeRow').addEventListener('change', function () {
    var m = selectedMode();
    document.getElementById('knowledgeGroup').style.display = m === 'knowledge' ? 'block' : 'none';
    document.getElementById('contextGroup').style.display = m === 'context' ? 'block' : 'none';
    syncOptGroup();
  });
  document.getElementById('knowledgeRow').addEventListener('change', function (e) {
    var checked = selectedK();
    if (checked.length > 3) {
      var input = e.target;
      input.checked = false;
      toast('最多选择 3 个知识点');
    }
    syncOptGroup();
  });

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeQuestion() {
    var t = selectedType();
    var types = t === 'mixed' ? ['single', 'multi', 'judge', 'blank'] : [t];
    var type = pick(types);
    var ks = selectedK();
    var candidates = POOL.filter(function (q) { return q.type === type && ks.indexOf(q.k) !== -1; });
    if (!candidates.length) candidates = POOL.filter(function (q) { return q.type === type; });
    var data = candidates.length ? pick(candidates) : pick(POOL.filter(function (q) { return q.type === type; }));
    return data;
  }

  function letter(i) { return String.fromCharCode(65 + i); }
  function isRight(data, i) {
    if (data.type === 'multi') return data.answer.indexOf(i) !== -1;
    return data.answer === i;
  }

  function renderCard(data) {
    var card = document.createElement('div');
    card.className = 'q-card';

    var optionsHtml;
    if (data.type === 'blank') {
      optionsHtml = '<div class="q-opt right"><span class="letter">答</span>参考答案：<b style="margin-left:4px">' + escapeHtml(data.answer) + '</b><span class="flag">正确答案</span></div>';
    } else {
      optionsHtml = '<div class="q-options">' + data.options.map(function (opt, i) {
        var right = isRight(data, i);
        return '<div class="q-opt' + (right ? ' right' : '') + '"><span class="letter">' + letter(i) + '</span>' + escapeHtml(opt) + (right ? '<span class="flag">✓ 正确答案</span>' : '') + '</div>';
      }).join('') + '</div>';
    }

    card.innerHTML =
      '<div class="q-head">' +
        '<span class="badge ' + typeBadge[data.type] + '">' + typeName[data.type] + '</span>' +
        '<span class="badge ' + diffBadge[data.difficulty] + '">' + data.difficulty + '</span>' +
        '<span class="tag blue">' + escapeHtml(data.k) + '</span>' +
      '</div>' +
      '<div class="q-stem">' + escapeHtml(data.stem) + '</div>' +
      optionsHtml +
      '<div class="q-analysis"><b>解析：</b>' + escapeHtml(data.analysis) + '</div>' +
      '<div class="q-actions">' +
        '<button class="btn btn-outline btn-sm" data-act="regen"><i class="ri-refresh-line"></i> 重新生成</button>' +
        '<button class="btn btn-primary btn-sm" data-act="add"><i class="ri-add-line"></i> 加入题库</button>' +
      '</div>';

    card.querySelector('[data-act="regen"]').addEventListener('click', function () {
      var nd = makeQuestion();
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = '';
      card.replaceWith(renderCard(nd));
      updateCount();
    });
    card.querySelector('[data-act="add"]').addEventListener('click', function () {
      bankCount++;
      bankCountEl.textContent = bankCount;
      toast('已加入题库 · 当前 ' + bankCount + ' 题');
    });

    return card;
  }

  function updateCount() {
    resultCount.textContent = results.querySelectorAll('.q-card').length;
  }

  function generate() {
    var n = parseInt(document.getElementById('countSelect').value, 10);
    results.innerHTML = '';
    for (var i = 0; i < n; i++) results.appendChild(renderCard(makeQuestion()));
    updateCount();
    results.parentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('genBtn').addEventListener('click', generate);

  syncOptGroup();
  generate();
})();
</script>
</body>
</html>
